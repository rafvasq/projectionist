plex:
  url: "http://192.168.1.X:32400"
  # When running in Docker on the same machine as Plex, use:
  # url: "http://host.docker.internal:32400"
  token: ""
  library: "Movies"

ai:
  provider: gemini        # gemini | ollama

  # Gemini
  model: "gemini-3.5-flash-lite"
  api_key: ""

  # Ollama (local, self-hosted — uncomment and set provider: ollama above)
  # model: "llama3"
  # base_url: "http://ollama:11434"  # use http://localhost:11434 outside Docker

rows:
  count: 1              # number of AI-generated collections per run
  max_results: 15       # max films per collection
  cooldown_weeks: 3     # films surfaced recently won't reappear for this many weeks

schedule:
  cron: "0 3 * * 1"  # every Monday at 3am

whatsapp:
  enabled: false
  # Who may use the bot. Admins can use slash commands and import Letterboxd lists, and get
  # cleaner summaries and alerts. Users can request films and shows in plain language and
  # hear about new arrivals and the weekly digest. A missing role means user.
  # users:
  #   - number: "whatsapp:+12345678900"
  #     role: admin
  #   - number: "whatsapp:+19876543210"
  #     role: user
  # Simple setup: every number here is an admin. Ignored when `users` is set.
  allowed_numbers:
    - "whatsapp:+12345678900"
  twilio_account_sid: ""
  twilio_auth_token: ""
  twilio_phone_number: ""
  # The webhook verifies Twilio's request signature using twilio_auth_token and rejects
  # requests without a valid one. Behind a reverse proxy or tunnel (e.g. the bundled ngrok)
  # set this to the public base URL Twilio calls, with no path. With ngrok it is
  # https://<NGROK_DOMAIN>, the same domain as the webhook URL you gave Twilio:
  # public_url: "https://bot.example.com"
  # Local development only: skip signature verification.
  # verify_signature: false
  # Optional Twilio Content Template SIDs:
  # availability_template_sid: ""
  # digest_template_sid: ""
  # cleaner_template_sid: ""

overseerr:
  url: "http://192.168.1.X:5055"
  api_key: ""
  # Shared secret for the /overseerr webhook (required). Set the same value as the
  # "Authorization Header" in Overseerr > Settings > Notifications > Webhook.
  # Generate one with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  webhook_secret: ""

radarr:
  url: "http://192.168.1.X:7878"
  api_key: ""

deletion:
  enabled: false
  dry_run: true
  # Movies matching a rule are flagged, wait `grace_days` in a queue (see /leaving and the
  # Leaving Soon row; /keep rescues one), then are deleted, at most `max_deletions_per_run`
  # per cleaner run.
  grace_days: 30
  max_deletions_per_run: 10
  # Without `rules`, a movie is flagged when nobody added or watched it for this many days.
  max_age_days: 120
  # Or define rules. Conditions: idle_days, added_days, last_watched_days, each with a
  # _gte or _lt suffix. All conditions in a rule must match; any rule can flag a movie.
  # rules:
  #   - name: idle
  #     when:
  #       idle_days_gte: 120
  protect_tag: "Keep Forever"
  leaving_soon_row: true    # Keep a 'Leaving Soon' collection in Plex in step with the queue
  leaving_soon_limit: 25    # Max movies in the row (0 or omit for all)
