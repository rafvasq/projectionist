services:
  projectionist:
    # image: ghcr.io/rafvasq/projectionist:latest
    # Comment out the image line above and uncomment below to build locally
    build: .
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    environment:
      - TZ=America/New_York
      - PYTHONUNBUFFERED=1

  ollama:
    profiles: [ollama]
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  whatsapp-bot:
    build: .
    container_name: projectionist-whatsapp-bot
    restart: unless-stopped
    entrypoint: ["python", "-m", "bot.main"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    ports:
      - "5000:5000"
    environment:
      - TZ=America/New_York
      - PYTHONUNBUFFERED=1

  ngrok:
    image: ngrok/ngrok:latest
    container_name: projectionist-ngrok
    restart: unless-stopped
    command: ["http", "whatsapp-bot:5000", "--domain=${NGROK_DOMAIN:-}"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - whatsapp-bot

volumes:
  ollama_data:
